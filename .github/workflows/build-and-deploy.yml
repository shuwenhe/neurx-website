name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build project
        run: npm run build
      
      - name: Commit and push build files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
        run: |
          git config --local user.email "1201220707@pku.edu.cn"
          git config --local user.name "shuwenhe"
          git add dist/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore: auto-build dist files [skip ci]"
            git push "https://shuwenhe:${PERSONAL_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main
          else
            echo "No changes in dist/ files"
          fi
