name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Build project
        run: npm run build
      
      - name: Check for changes
        id: check
        run: |
          if git diff-index --quiet HEAD -- dist/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push build files
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check.outputs.has_changes == 'true'
        run: |
          git config --local user.email "1201220707@pku.edu.cn"
          git config --local user.name "shuwenhe"
          git add dist/
          git commit -m "chore: auto-build dist files [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
