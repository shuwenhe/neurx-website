name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # Optional: deploy to OpenAI Hosting. To enable, add OPENAI_API_KEY secret
      # and uncomment the steps below. This example assumes the 'openai' CLI
      # is available via npm package '@openai/cli' — verify the CLI package and
      # command before enabling in your environment.
      #
      # - name: Install OpenAI CLI
      #   run: npm install -g @openai/cli
      #
      # - name: Deploy to OpenAI Hosting
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    